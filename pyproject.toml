[project]
name = "auto-drone-mapping"
version = "0.1.0"
description = "Cooperative drone swarm for autonomous exploration and 2.5D mapping in MuJoCo"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mujoco>=3.2.0",
    "numpy>=2.0.0",
    "pillow>=12.2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The operator console (Feature 13). Optional so the simulator, CI and the
# Docker image never install it: `uv sync --extra ui`.
ui = ["streamlit>=1.40"]

[project.scripts]
swarm-mapping = "swarm_mapping.cli:main"
swarm-console = "swarm_mapping.app.launch:main"

[dependency-groups]
dev = [
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "D",    # pydocstyle
]
ignore = [
    "D100",  # missing docstring in public module (added gradually)
    "D104",  # missing docstring in public package
    "D107",  # missing docstring in __init__ (args documented on class)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["swarm_mapping"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "src"
packages = ["swarm_mapping"]

[[tool.mypy.overrides]]
module = ["mujoco.*", "yaml"]
ignore_missing_imports = true

# The console's optional extra (and pandas, which streamlit brings). CI syncs
# without it, so mypy there must accept the imports as missing; locally, with
# the extra, streamlit's own hints apply. pandas ships no stubs either way.
[[tool.mypy.overrides]]
module = ["streamlit", "streamlit.*", "pandas", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "sprint(n): sprint the test was introduced in; drives the regression/progression split (see tests/conftest.py)",
    "regression: derived from sprint(n) — prior sprints; shipped behaviour that must not break. Runs on every push (see tests/conftest.py)",
    "progression: derived from sprint(n) — current sprint; work in flight. Runs on every push (see tests/conftest.py)",
    "sanity: fast, minimal cross-module health check; keep it small and quick",
    "acceptance: full-scenario runs with tolerance bands; minutes, not seconds. Selects COST, not era — acceptance tests still carry sprint(n). CI runs them as their own step on PRs to main, never on push. Deselect locally with -m 'not acceptance'.",
]

[tool.hatch.build.targets.wheel]
packages = ["src/swarm_mapping"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
