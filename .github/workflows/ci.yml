name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check src/ tests/ benchmarks/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ benchmarks/

      - name: Mypy
        run: uv run mypy src/

      # Both labels run on every push, as separate steps, so a red build says
      # whether shipped behaviour broke (Regression) or in-flight work isn't
      # done (Progression). Until Sprint 3 each gate ran only one label and no
      # gate ever ran the whole suite — see docs/sprint-3-plan.md, Task 0.
      - name: Regression — prior sprints, must not break
        run: uv run pytest -m "regression and not acceptance" --cov=swarm_mapping --cov-report=term-missing -v

      # Exit code 5 is pytest's "no tests collected": a sprint that has not
      # written its first test yet has an empty progression set, which is fine.
      - name: Progression — current sprint, work in flight
        run: uv run pytest -m "progression and not acceptance" --cov=swarm_mapping --cov-append --cov-report=term-missing -v || [ $? -eq 5 ]

      # Full-scenario runs: minutes, not seconds. PRs to main only, per CLAUDE.md.
      - name: Acceptance (pull request to main)
        if: github.event_name == 'pull_request'
        run: uv run pytest -m acceptance -v
