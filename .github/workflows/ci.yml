name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Mypy
        run: uv run mypy src/

      # Per-commit gate: the accumulated must-not-break suite (+ fast sanity).
      # Empty until Sprint 2 ships, so `or sanity` keeps it from erroring on an
      # empty selection and always runs the quick cross-module smoke.
      - name: Regression + sanity (every push)
        if: github.event_name == 'push'
        run: uv run pytest -m "regression or sanity" --cov=swarm_mapping --cov-report=term-missing -v

      # PR-to-main gate: the current sprint's work (+ sanity).
      - name: Progression + sanity (pull request)
        if: github.event_name == 'pull_request'
        run: uv run pytest -m "progression or sanity" --cov=swarm_mapping --cov-report=term-missing -v
